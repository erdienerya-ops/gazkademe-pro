name: Build GazKademe Pro APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/gazkademe-android.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -e
          SDK="$RUNNER_TEMP/gaz-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true
          "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
      - name: Bundle existing web app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp icon-512.png android/app/src/main/assets/gaz-logo.png
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icon-512.png android/app/src/main/res/drawable-nodpi/gaz_logo.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('</head>', '<style id="gk-preload">html{background:#020817!important}body>main{visibility:hidden}</style></head>',1)
          s=s.replace('</body>', '<script src="fire.js"></script><script>setTimeout(()=>document.getElementById("gk-preload")?.remove(),4500)</script></body>')
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GazKademe-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
